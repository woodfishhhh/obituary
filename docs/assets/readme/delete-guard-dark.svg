<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc">
<title id="title">删除护栏：agent 删掉的东西都能复活</title>
<desc id="desc">agent 发出 rm -rf build，讣告拦下这一次执行（只拦不改），告诉 agent 等价命令 obit rm -rf build；agent 改用它，东西进墓地，obit resurrect &lt;id&gt; 一条命令放回原处。</desc>
<defs>
<linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0876FF"/><stop offset=".55" stop-color="#16B8FA"/><stop offset=".62" stop-color="#FFE052"/><stop offset="1" stop-color="#FFB329"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="234" rx="28" fill="#0E1628" stroke="#22314D" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<g>
<path d="M64 48H333L357 72V172A16 16 0 0 1 341 188H64A16 16 0 0 1 48 172V64A16 16 0 0 1 64 48Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M333 48V72H357Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="72" y="96" font-size="28" font-weight="700" fill="#E8EEF9">删除命令</text>
<rect x="68" y="114" width="156" height="34" rx="8" fill="#3B2119"/>
<text x="81" y="137" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#FFA27E">rm -rf build</text>
<text x="72" y="174" font-size="18" fill="#A1B1CC">agent 发出，讣告拦下</text>
</g>
<path d="M357 118H434" stroke="#5E6C86" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M445 118l-13 -7.5v15Z" fill="#5E6C86"/>
<text x="401" y="104" font-size="18" fill="#A1B1CC" text-anchor="middle">只拦不改</text>
<g>
<path d="M461 48H730L754 72V172A16 16 0 0 1 738 188H461A16 16 0 0 1 445 172V64A16 16 0 0 1 461 48Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M730 48V72H754Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="469" y="96" font-size="28" font-weight="700" fill="#E8EEF9">等价命令</text>
<rect x="465" y="114" width="210" height="34" rx="8" fill="#1B2B4E"/>
<text x="478" y="137" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit rm -rf build</text>
<text x="469" y="174" font-size="18" fill="#A1B1CC">agent 改用它，东西进墓地</text>
</g>
<path d="M754 118H831" stroke="#4C9BFF" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M842 118l-13 -7.5v15Z" fill="#4C9BFF"/>
<g>
<path d="M858 48H1128L1152 72V172A16 16 0 0 1 1136 188H858A16 16 0 0 1 842 172V64A16 16 0 0 1 858 48Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M1128 48V72H1152Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="866" y="96" font-size="28" font-weight="700" fill="#E8EEF9">复活</text>
<rect x="862" y="114" width="231" height="34" rx="8" fill="#1B2B4E"/>
<text x="875" y="137" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit resurrect &lt;id&gt;</text>
<text x="866" y="174" font-size="18" fill="#A1B1CC">一条命令放回原处</text>
<path d="M17.6 9.4c.3 5.3 1.2 6.5 5.2 7-4 .6-4.9 2-5.2 7.1-.6-5.1-1.3-6.4-5.5-7.1 4.2-.6 4.9-1.8 5.5-7Z" fill="url(#spark)" transform="translate(940 85) scale(1.9) translate(-17.5 -16.45)"/>
</g>
</g>
</svg>
