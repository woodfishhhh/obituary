<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">讣告 Obituary 的生命周期</title>
<desc id="desc">登记（obit add，或右键放进讣告）→ 到期（obit list 看谁还剩多久）→ 收割，下葬进墓地（obit graveyard，默认保留 7 天）→ 复活（obit resurrect，放回原处，绝不覆盖已有文件），或保留期过后火化（obit purge，真正删除）。</desc>
<defs>
<linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0876FF"/><stop offset=".55" stop-color="#16B8FA"/><stop offset=".62" stop-color="#FFE052"/><stop offset="1" stop-color="#FFB329"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="398" rx="28" fill="#0E1628" stroke="#22314D" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<g>
<path d="M64 130H310L334 154V254A16 16 0 0 1 318 270H64A16 16 0 0 1 48 254V146A16 16 0 0 1 64 130Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M310 130V154H334Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="72" y="178" font-size="28" font-weight="700" fill="#E8EEF9">登记</text>
<rect x="68" y="196" width="253" height="34" rx="8" fill="#1B2B4E"/>
<text x="81" y="219" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit add debug.log 2h</text>
<text x="72" y="256" font-size="18" fill="#A1B1CC">或右键放进讣告</text>
</g>
<path d="M334 200H363" stroke="#4C9BFF" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M374 200l-13 -7.5v15Z" fill="#4C9BFF"/>
<g>
<path d="M390 130H530L554 154V254A16 16 0 0 1 538 270H390A16 16 0 0 1 374 254V146A16 16 0 0 1 390 130Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M530 130V154H554Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="398" y="178" font-size="28" font-weight="700" fill="#E8EEF9">到期</text>
<rect x="394" y="196" width="123" height="34" rx="8" fill="#1B2B4E"/>
<text x="407" y="219" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit list</text>
<text x="398" y="256" font-size="18" fill="#A1B1CC">谁还剩多久</text>
</g>
<path d="M554 200H603" stroke="#4C9BFF" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M614 200l-13 -7.5v15Z" fill="#4C9BFF"/>
<text x="584" y="186" font-size="18" fill="#A1B1CC" text-anchor="middle">收割</text>
<g>
<path d="M630 130H790L814 154V254A16 16 0 0 1 798 270H630A16 16 0 0 1 614 254V146A16 16 0 0 1 630 130Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M790 130V154H814Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="638" y="178" font-size="28" font-weight="700" fill="#E8EEF9">下葬进墓地</text>
<rect x="634" y="196" width="177" height="34" rx="8" fill="#1B2B4E"/>
<text x="647" y="219" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit graveyard</text>
<text x="638" y="256" font-size="18" fill="#A1B1CC">默认保留 7 天</text>
</g>
<path d="M814 200H844" stroke="#4C9BFF" stroke-width="3" stroke-linecap="round"/>
<path d="M844 200V122Q844 114 852 114H863" stroke="#FFC24D" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M874 114l-13 -7.5v15Z" fill="#FFC24D"/>
<path d="M844 200V278Q844 286 852 286H863" stroke="#5E6C86" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M874 286l-13 -7.5v15Z" fill="#5E6C86"/>
<circle cx="844" cy="200" r="5" fill="#4C9BFF"/>
<g>
<path d="M890 44H1128L1152 68V168A16 16 0 0 1 1136 184H890A16 16 0 0 1 874 168V60A16 16 0 0 1 890 44Z" fill="#152039" stroke="#2E4166" stroke-width="2"/>
<path d="M1128 44V68H1152Z" fill="#E9A95E" stroke="#2E4166" stroke-width="2" stroke-linejoin="round"/>
<text x="898" y="92" font-size="28" font-weight="700" fill="#E8EEF9">复活</text>
<rect x="894" y="110" width="199" height="34" rx="8" fill="#1B2B4E"/>
<text x="907" y="133" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit resurrect 3</text>
<text x="898" y="170" font-size="18" fill="#A1B1CC">放回原处，绝不覆盖已有文件</text>
<path d="M17.6 9.4c.3 5.3 1.2 6.5 5.2 7-4 .6-4.9 2-5.2 7.1-.6-5.1-1.3-6.4-5.5-7.1 4.2-.6 4.9-1.8 5.5-7Z" fill="url(#spark)" transform="translate(972 81) scale(1.9) translate(-17.5 -16.45)"/>
</g>
<g>
<path d="M890 216H1128L1152 240V340A16 16 0 0 1 1136 356H890A16 16 0 0 1 874 340V232A16 16 0 0 1 890 216Z" fill="#111A2D" stroke="#3A4966" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M1128 216V240H1152Z" fill="#2B364C" stroke="#3A4966" stroke-width="2" stroke-linejoin="round"/>
<text x="898" y="264" font-size="28" font-weight="700" fill="#E8EEF9">火化</text>
<rect x="894" y="282" width="134" height="34" rx="8" fill="#1B2B4E"/>
<text x="907" y="305" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit purge</text>
<text x="898" y="342" font-size="18" fill="#A1B1CC">保留期过后，真正删除</text>
</g>
<text x="52" y="84" font-size="22" font-weight="600" fill="#A1B1CC">生命周期</text>
<text x="52" y="318" font-size="18" fill="#A1B1CC">到期之前可以</text>
<rect x="168" y="295" width="145" height="34" rx="8" fill="#1B2B4E"/>
<text x="181" y="318" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit extend</text>
<text x="321" y="318" font-size="18" fill="#A1B1CC">续命，</text>
<rect x="383" y="295" width="134" height="34" rx="8" fill="#1B2B4E"/>
<text x="396" y="318" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8DBDFF">obit spare</text>
<text x="525" y="318" font-size="18" fill="#A1B1CC">饶命</text>
</g>
</svg>
