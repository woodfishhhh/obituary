# Ship platform archives with LICENSE and SHA-256 checksums so downloads
# can be verified before installation.
version: 2
project_name: obituary
dist: bin/release

before:
  hooks:
    - node scripts/build-frontend.mjs
    - go run ./scripts/winres -version {{ .Version }}

builds:
  - id: obit
    main: ./cmd/obit
    binary: obit
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obitd
    main: ./cmd/obitd
    binary: obitd
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -H windowsgui -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obit-gui
    main: ./cmd/obit-gui
    binary: obit-gui
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    tags: [desktop, production]
    flags: [-trimpath]
    ldflags:
      - -s -w -H windowsgui -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obit-darwin
    main: ./cmd/obit
    binary: obit
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obitd-darwin
    main: ./cmd/obitd
    binary: obitd
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obit-linux
    main: ./cmd/obit
    binary: obit
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

  - id: obitd-linux
    main: ./cmd/obitd
    binary: obitd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/woodfishhhh/obituary/internal/buildinfo.Version={{ .Version }}

archives:
  - id: windows
    ids: [obit, obitd, obit-gui]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The desktop GUI is amd64-only; arm64 ships the CLI and daemon.
    allow_different_binary_count: true
    files:
      - LICENSE
      - src: packaging/README.txt
        strip_parent: true
  - id: darwin
    ids: [obit-darwin, obitd-darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: packaging/posix/README.txt
        strip_parent: true
  - id: linux
    ids: [obit-linux, obitd-linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: packaging/posix/README.txt
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-dev.{{ .ShortCommit }}"

# Draft release notes (release.yml passes CHANGELOG.md to the draft): commit
# subjects since the previous tag, without the first commit or merges. The
# draft is edited by hand before it is published.
changelog:
  sort: asc
  filters:
    exclude:
      - "^Initial commit$"
      - "^Merge "

# Reference: goreleaser/goreleaser internal/pipe/{scoop,winget} at v2.20.0.
# Both pipes derive SHA-256 from the zip itself. Publishing remains manual.
# scripts/finalize-manifests.mjs adds Scoop notes and WinGet's directory PATH.
scoops:
  - name: obituary
    ids: [windows]
    repository:
      owner: woodfishhhh
      name: scoop-bucket
    skip_upload: true
    url_template: "https://github.com/woodfishhhh/obituary/releases/download/v{{ .Version }}/{{ .ArtifactName }}"

winget:
  - name: obituary
    ids: [windows]
    package_identifier: woodfishhhh.Obituary
    package_name: Obituary
    publisher: woodfishhhh
    publisher_url: https://github.com/woodfishhhh
    publisher_support_url: https://github.com/woodfishhhh/obituary/issues
    homepage: https://github.com/woodfishhhh/obituary
    short_description: The trash bin for AI agents. Give files a lifespan and restore them from a graveyard.
    license: MIT
    license_url: https://github.com/woodfishhhh/obituary/blob/main/LICENSE
    installation_notes: >-
      Before removing binaries, run obit uninstall --yes in the current project;
      data is kept by default. The desktop GUI is available on amd64 only and
      requires WebView2 Runtime. Close Obituary programs before upgrading.
      Obituary checks for updates at most once a day, reading only public release information.
      You can turn off "Check for updates automatically" in Settings or set check = false under [update] in config.toml.
      Privacy: https://obituary.woodfish.site/docs/en/privacy
    repository:
      owner: microsoft
      name: winget-pkgs
    skip_upload: true
    url_template: "https://github.com/woodfishhhh/obituary/releases/download/v{{ .Version }}/{{ .ArtifactName }}"

# Generate a macOS cask for review; the owner publishes it separately.
homebrew_casks:
  - name: obituary
    ids: [darwin]
    repository:
      owner: woodfishhhh
      name: homebrew-tap
    directory: Casks
    skip_upload: true
    homepage: https://obituary.woodfish.site
    description: "Trash bin for AI agents: files get a lifespan and stay restorable"
    license: MIT
    url:
      template: "https://github.com/woodfishhhh/obituary/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    binaries: [obit, obitd]
    caveats: |
      Run obit init --dry-run to review agent integration.
      Run obit daemon enable --dry-run to review the user scheduler.
      On first use, run obit --version and obitd --help. If Gatekeeper asks
      for approval, open System Settings > Privacy & Security, choose Open
      Anyway for each verified executable, and retry the command.

# WinGet's portable installer and 1.10 installer schema do not provide Start
# menu shortcuts (microsoft/winget-cli Workflows/PortableFlow.cpp); use the
# PowerShell installer or Scoop for a Start menu entry.

release:
  draft: true
  prerelease: auto

