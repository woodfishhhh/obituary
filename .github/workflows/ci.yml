# Full tests run here, not on developer machines (D-0038): several workers
# running the whole suite on one machine slowed every package 20x or more.
# The repository is public, so standard runners cost nothing: every push and
# pull request runs the four full shards in parallel, which keeps the wall
# time near the slowest shard. The mutation suites, split across runners,
# run weekly and on demand (before releases).
name: ci

on:
  push:
    branches: [main]
    # Documentation and website pushes do not need a Windows test run
    # (pages.yml builds site/).
    paths-ignore: ["docs/**", "**/*.md", "site/**"]
  # Every pull request runs CI, docs-only ones too: the required checks on
  # main must report or the pull request could never merge.
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the four full test shards
        type: boolean
        default: true
      mutations:
        description: Also run both mutation suites
        type: boolean
        default: false
  schedule:
    - cron: "47 18 * * 0" # weekly mutation suites, Monday 02:47 Beijing

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GOTESTSUM: gotest.tools/gotestsum@v1.13.0

jobs:
  # Packaging is the slowest job and rarely touched: on pushes, run the
  # snapshot build and installer tests only when packaging inputs changed
  # (always on PRs, manual and scheduled runs).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "package=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(\.goreleaser\.yaml|install\.sh$|packaging/|scripts/|cmd/obit-gui/frontend/|cmd/[^/]+/resources\.go$|internal/tray/obituary\.ico$|\.github/workflows/|go\.(mod|sum)$|LICENSE$)'; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.11.0"
          run_install: false
      - name: Build release archives and manifests (no publishing)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --skip=publish
      - name: Verify Windows executable resources
        run: go run ./scripts/winres -check bin/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posix-archives
          if-no-files-found: error
          path: |
            bin/release/*.tar.gz
            bin/release/checksums.txt
      - name: Finalize local channel manifests
        run: node scripts/finalize-manifests.mjs bin/release
      - name: Verify snapshot installer without changing user PATH
        env:
          OBIT_INSTALL_TEST_ROOT: ${{ runner.temp }}
        run: node --test scripts/install.test.mjs
      - name: Verify committed frontend dist
        shell: pwsh
        run: |
          if (Test-Path cmd/obit-gui/frontend/package.json) {
            $changes = git diff --name-only HEAD -- cmd/obit-gui/frontend/dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Include ignored new assets, too: every generated file must be committed.
            $untracked = git ls-files --others -- cmd/obit-gui/frontend/dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($changes -or $untracked) {
              Write-Output $changes
              Write-Output $untracked
              Write-Output '::error::frontend/dist is stale. Run pnpm build in cmd/obit-gui/frontend locally and commit the updated dist.'
              exit 1
            }
          } else {
            Write-Output 'No frontend/package.json; using the committed frontend/dist and skipping the rebuild comparison.'
          }

  # Known vulnerabilities in the Go toolchain, the standard library and the
  # modules, for the shipped Windows build. It also runs on the weekly
  # schedule, so a newly published advisory shows up without a code change.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Build the tool for the runner, then analyse the Windows build.
      - name: govulncheck (GOOS=windows)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./...

  # Both target platforms are type-checked on one Linux runner.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet (windows)
        env:
          GOOS: windows
        run: go vet ./...
      - name: golangci-lint (windows, new issues only)
        env:
          GOOS: windows
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ${{ github.event_name == 'push' && format('--new-from-rev={0}', github.event.before) || '' }}
      - name: go vet (linux)
        env:
          GOOS: linux
        run: go vet ./...
      - name: golangci-lint (linux, new issues only)
        env:
          GOOS: linux
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ${{ github.event_name == 'push' && format('--new-from-rev={0}', github.event.before) || '' }}

  # Run every package on both POSIX platforms whenever the Windows shards do.
  linux:
    needs: changes
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build POSIX packages
        run: go build ./...
      - name: Cross-build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/...
      - name: POSIX tests
        env:
          TMPDIR: /tmp
        run: go test ./...
      - name: POSIX installation mutations
        env:
          OBIT_TEST_POSIX_MUTATIONS: "1"
        run: go test -run '^TestPOSIXCommitMutations$' ./internal/integrate

      - name: Native POSIX safety mutations
        env:
          OBIT_TEST_DELETE_MUTATIONS: "1"
        run: go test -count=1 -run '^TestDeleteGuardMutations/native-posix-' ./internal/cli/remove

  macos:
    needs: changes
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build POSIX packages and both macOS architectures
        run: |
          go build ./...
          GOOS=darwin GOARCH=amd64 go build ./cmd/obit ./cmd/obitd
          GOOS=darwin GOARCH=arm64 go build ./cmd/obit ./cmd/obitd
      - name: POSIX tests
        run: go test ./...
      - name: POSIX installation mutations
        env:
          OBIT_TEST_POSIX_MUTATIONS: "1"
        run: go test -run '^TestPOSIXCommitMutations$' ./internal/integrate

      - name: Native POSIX safety mutations
        env:
          OBIT_TEST_DELETE_MUTATIONS: "1"
        run: go test -count=1 -run '^TestDeleteGuardMutations/native-posix-' ./internal/cli/remove

  install-posix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: posix-archives
          path: ${{ runner.temp }}/posix-archives
      - name: Install a verified snapshot and reject corrupt downloads
        env:
          OBIT_INSTALL_TEST_DIST: ${{ runner.temp }}/posix-archives
        run: python3 scripts/install-sh.test.py

  # Every push and PR, and on demand: the four slowest areas each get a
  # runner; the wall time is the slowest shard instead of the sum. Keep
  # "rest" as the complement of the others.
  test:
    needs: changes
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: e2e, pkgs: "./internal/e2e" }
          - { name: core, pkgs: "./internal/core/..." }
          - { name: install, pkgs: "./internal/integrate ./internal/cli/init ./internal/cli/doctor" }
          - { name: rest, pkgs: "" }
    name: test (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Run tests from pwsh, never from Git Bash: the MSYS runtime enables
      # SeBackupPrivilege and SeRestorePrivilege on an elevated token and every
      # child inherits them, so the deny-ACL fixtures stop denying anything.
      - name: go test
        shell: pwsh
        run: |
          # @() keeps a single package an array; a bare string would be split.
          $pkgs = @("${{ matrix.shard.pkgs }}" -split ' ' | Where-Object { $_ })
          if ($pkgs.Count -eq 0) {
            $pkgs = @(go list ./... | Where-Object { $_ -notmatch '/internal/(core(/|$)|(e2e|integrate|cli/init|cli/doctor)$)' })
          }
          go run ${{ env.GOTESTSUM }} --format testname --jsonfile test.json -- -count=1 -timeout 30m $pkgs
      - name: Slowest 30 tests
        if: always()
        shell: bash
        run: |
          {
            echo "### Slowest tests (${{ matrix.shard.name }})"
            echo '```'
            go run ${{ env.GOTESTSUM }} tool slowest --jsonfile test.json --threshold 1s | head -30
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  mutations:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 18 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.mutations)
    runs-on: windows-latest
    timeout-minutes: 60
    # Each mutation recompiles its package, so one runner works through
    # them serially; the cases are split by index across runners instead
    # (OBIT_MUTATION_SHARD, see internal/testenv/mutation.go).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 0/6 }
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 1/6 }
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 2/6 }
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 3/6 }
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 4/6 }
          - { suite: mcp, run: TestMCPMutations, pkg: ./internal/cli/mcp, shard: 5/6 }
          - { suite: delete-guard, run: TestDeleteGuardMutations, pkg: ./internal/cli/remove, shard: 0/2 }
          - { suite: delete-guard, run: TestDeleteGuardMutations, pkg: ./internal/cli/remove, shard: 1/2 }
    name: mutations (${{ matrix.suite }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: ${{ matrix.run }}
        env:
          OBIT_TEST_MCP_MUTATIONS: "1"
          OBIT_TEST_DELETE_MUTATIONS: "1"
          OBIT_TEST_REGISTRY: "1" # testenv confines registry writes to disposable keys
          OBIT_MUTATION_SHARD: ${{ matrix.shard }}
        run: go test -count=1 -timeout 50m -run ${{ matrix.run }} ${{ matrix.pkg }}
