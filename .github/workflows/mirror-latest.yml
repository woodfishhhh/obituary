name: mirror-latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    concurrency:
      group: cn-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Trigger verified pull on the mainland mirror
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          CN_MIRROR_TRIGGER_KEY: ${{ secrets.CN_MIRROR_TRIGGER_KEY }}
          CN_DEPLOY_HOST: ${{ secrets.CN_DEPLOY_HOST }}
          CN_DEPLOY_KNOWN_HOSTS: ${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable tag (vX.Y.Z)' >&2; exit 1; }
          : "${CN_MIRROR_TRIGGER_KEY:?Missing CN_MIRROR_TRIGGER_KEY}" "${CN_DEPLOY_HOST:?Missing CN_DEPLOY_HOST}" "${CN_DEPLOY_KNOWN_HOSTS:?Missing CN_DEPLOY_KNOWN_HOSTS}"
          umask 077
          cd "$(mktemp -d "$RUNNER_TEMP/mirror-ssh.XXXXXXXX")"
          trap 'rm -f -- key known_hosts' EXIT
          printf '%s\n' "$CN_MIRROR_TRIGGER_KEY" | tr -d '\r' > key
          printf '%s\n' "$CN_DEPLOY_KNOWN_HOSTS" > known_hosts
          ssh -nT -i key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "obit-deploy@$CN_DEPLOY_HOST" "pull $TAG"
