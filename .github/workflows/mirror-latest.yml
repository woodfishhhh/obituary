name: mirror-latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    concurrency:
      group: cn-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Trigger the mirror pull and wait for it to finish
        shell: bash
        env:
          CN_MIRROR_TRIGGER_KEY: ${{ secrets.CN_MIRROR_TRIGGER_KEY }}
          CN_DEPLOY_HOST: ${{ secrets.CN_DEPLOY_HOST }}
          CN_DEPLOY_KNOWN_HOSTS: ${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable tag (vX.Y.Z)' >&2; exit 1; }
          : "${CN_MIRROR_TRIGGER_KEY:?Missing CN_MIRROR_TRIGGER_KEY}" "${CN_DEPLOY_HOST:?Missing CN_DEPLOY_HOST}" "${CN_DEPLOY_KNOWN_HOSTS:?Missing CN_DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/cn-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$CN_MIRROR_TRIGGER_KEY" > "$ssh_dir/key"
          printf '%s\n' "$CN_DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_opts=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                    -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15
                    -o ServerAliveInterval=30 -i "$ssh_dir/key")
          ssh "${ssh_opts[@]}" -- "obit-deploy@$CN_DEPLOY_HOST" "pull $TAG"
