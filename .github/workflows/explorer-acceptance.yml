name: Windows Explorer acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Obituary version to install (for example 1.7.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  explorer:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OBIT_TELEMETRY: '0'
      EXPECTED_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise published Explorer handlers (no desktop clicks)
        shell: bash
        run: python scripts/test-windows-explorer.py
      - name: Upload Explorer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explorer-acceptance-${{ inputs.version }}
          if-no-files-found: error
          path: ${{ runner.temp }}/obit-explorer-acceptance
