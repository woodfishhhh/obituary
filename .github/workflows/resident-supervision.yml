name: Resident supervision
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/resident-supervision.yml
      - scripts/test-windows-resident.py
      - internal/app/*windows.go
      - cmd/obitd/main.go

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        trigger: [manual, clock]
        exit-code: ["1", "0xC0000005"]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Kill and stop a scheduler-owned obitd
        shell: bash
        run: python -u scripts/test-windows-resident.py "${{ matrix.trigger }}" "${{ matrix.exit-code }}"
