name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-desktop:
    uses: ./.github/workflows/linux-desktop.yml
    with:
      snapshot: false

  macos-desktop:
    uses: ./.github/workflows/macos-desktop.yml
    with:
      snapshot: false

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.11.0"
          run_install: false
      - name: Build archives without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --skip=publish
      - name: Verify Windows executable resources
        run: go run ./scripts/winres -check bin/release
      - name: Finalize local channel manifests (no channel publishing)
        run: node scripts/finalize-manifests.mjs bin/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            bin/release/*.zip
            bin/release/*.tar.gz
            bin/release/checksums.txt
            bin/release/CHANGELOG.md
            bin/release/scoop/**
            bin/release/winget/**
            bin/release/homebrew/**

  publish:
    needs: [build, linux-desktop, macos-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-desktop-deb
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-desktop-package
          path: release/macos
      - name: Verify archives and add the native package to the same checksum list
        working-directory: release
        run: |
          sha256sum "obituary_${GITHUB_REF_NAME#v}_linux_amd64.deb" >> checksums.txt
          sed 's#  #  macos/#' macos/checksums.txt >> checksums.txt
          sha256sum --check --strict checksums.txt
      - name: Upload only to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Listing succeeds for a missing tag, but API/authentication failures
          # still fail closed. Include drafts and all pages when checking.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > releases.json
          id=$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) |
            if .draft then .id else error("Refusing to modify an existing public release") end' releases.json)
          if [[ -n "$id" ]]; then
            # Recheck immediately before upload in case it was published meanwhile.
            gh api "repos/$GH_REPO/releases/$id" | jq -e '.draft == true' > /dev/null
            gh release upload "$TAG" release/*.zip release/*.tar.gz release/*.deb release/macos/*.app.zip release/macos/*.dmg release/checksums.txt --clobber
          else
            flags=(--draft --verify-tag --title "$TAG" --notes-file release/CHANGELOG.md)
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/*.zip release/*.tar.gz release/*.deb release/macos/*.app.zip release/macos/*.dmg release/checksums.txt "${flags[@]}"
          fi
