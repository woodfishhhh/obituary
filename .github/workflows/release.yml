name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.11.0"
          run_install: false
      - name: Build archives without publishing
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --skip=publish
      - name: Verify Windows executable resources
        run: go run ./scripts/winres -check bin/release
      - name: Finalize local channel manifests (no channel publishing)
        run: node scripts/finalize-manifests.mjs bin/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            bin/release/*.zip
            bin/release/checksums.txt
            bin/release/CHANGELOG.md
            bin/release/scoop/**
            bin/release/winget/**

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-files
          path: release
      - name: Upload only to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Listing succeeds for a missing tag, but API/authentication failures
          # still fail closed. Include drafts and all pages when checking.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > releases.json
          id=$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) |
            if .draft then .id else error("Refusing to modify an existing public release") end' releases.json)
          if [[ -n "$id" ]]; then
            # Recheck immediately before upload in case it was published meanwhile.
            gh api "repos/$GH_REPO/releases/$id" | jq -e '.draft == true' > /dev/null
            gh release upload "$TAG" release/*.zip release/checksums.txt --clobber
          else
            flags=(--draft --verify-tag --title "$TAG" --notes-file release/CHANGELOG.md)
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/*.zip release/checksums.txt "${flags[@]}"
          fi

  # Copies the same archives and checksums.txt to the mainland China mirror
  # (https://obituary.woodfish.site/download/<tag>/), which install.ps1 falls
  # back to. Skipped when the deploy key is not configured.
  mirror:
    needs: publish
    runs-on: ubuntu-latest
    # Uploading the archives to the mainland server from a US runner is slow.
    timeout-minutes: 40
    permissions: {}
    steps:
      - id: key
        env:
          CN_DEPLOY_KEY: ${{ secrets.CN_DEPLOY_KEY }}
        run: echo "present=$([ -n "$CN_DEPLOY_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'yes'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-files
          path: release
      - name: Copy the release files to the mirror
        if: steps.key.outputs.present == 'yes'
        shell: bash
        env:
          CN_DEPLOY_KEY: ${{ secrets.CN_DEPLOY_KEY }}
          CN_DEPLOY_HOST: ${{ secrets.CN_DEPLOY_HOST }}
          CN_DEPLOY_KNOWN_HOSTS: ${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/cn-ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          echo "$CN_DEPLOY_KEY" > "$ssh_dir/key"
          echo "$CN_DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          mkdir -p "upload/$TAG"
          cp release/*.zip release/checksums.txt "upload/$TAG/"
          # No --delete: download/ keeps every earlier version.
          ssh_cmd="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          # The server lets one upload through at a time (rrsync); the release
          # archives, latest.json and the site can overlap, so wait and retry.
          for attempt in $(seq 1 10); do
            if rsync -rlt --chmod=D755,F644 -e "$ssh_cmd" "upload/$TAG" "obit-deploy@$CN_DEPLOY_HOST:download/"; then break; fi
            if [[ $attempt == 10 ]]; then exit 1; fi
            echo "upload attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
